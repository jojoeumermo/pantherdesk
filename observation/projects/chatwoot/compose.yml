# Chatwoot community edition only (see specs/LICENSES.md: enterprise/ is out of scope).
name: obs-chatwoot

networks:
  lab:
    external: true
    name: obslab_lab

x-base: &base
  image: chatwoot/chatwoot:v4.19.1-ce
  networks: [lab]
  env_file: chatwoot.env
  environment:
    NODE_ENV: production
    RAILS_ENV: production
    INSTALLATION_ENV: docker
  volumes:
    - storage:/app/storage

services:
  postgres:
    image: pgvector/pgvector:pg16
    networks: [lab]
    environment:
      POSTGRES_DB: chatwoot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: obs-lab-only
    volumes: [pg:/var/lib/postgresql/data]

  redis:
    image: redis:7.4-alpine
    networks: [lab]
    command: ["redis-server", "--requirepass", "obs-lab-only"]

  # One-off: creates the schema. Run with: docker compose ... run --rm prepare
  prepare:
    <<: *base
    profiles: [setup]
    depends_on: [postgres, redis]
    command: ["bundle", "exec", "rails", "db:chatwoot_prepare"]

  rails:
    <<: *base
    depends_on: [postgres, redis]
    entrypoint: docker/entrypoints/rails.sh
    command: ["bundle", "exec", "rails", "s", "-p", "3000", "-b", "0.0.0.0"]
    networks:
      lab:
        aliases: [chatwoot.lab.test]

  sidekiq:
    <<: *base
    depends_on: [postgres, redis]
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]

volumes:
  pg:
  storage:
